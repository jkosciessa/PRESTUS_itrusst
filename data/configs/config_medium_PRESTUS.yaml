simulation:
  medium: phantom

# Heat deposition from the absorption coefficient [dB/(cm MHz^y)], y = alpha_power.
# Brain and skull follow the PRESTUS v05 defaults (config/config_default.yaml); water is
# shared by all configurations.
thermal:
  absorption_model: coefficient

grid:
  resolution_mm: 0.5
  default_dims: [140, 240]
  pml_size: 40
  axisymmetric: 1
  use_kWaveArray: 1

medium_properties:
  water:
    sound_speed: 1482
    density: 994
    alpha_coeff: 0.0022
    alpha_power: 2
    thermal_conductivity: 0.60
    specific_heat_capacity: 4178
    absorption_coeff: 0.0022 # = water alpha_coeff (fraction 1)
  brain:
    sound_speed: 1546
    density: 1046
    alpha_coeff: 0.59 # PRESTUS v05 default (alpha_power 1.2): 0.257 dB/cm at 500 kHz
    alpha_power: 1.2
    thermal_conductivity: 0.51
    specific_heat_capacity: 3630
    perfusion: 559
    absorption_coeff: 0.59 # PRESTUS v05 default (= alpha_coeff, all attenuation absorbed)
  skull:
    sound_speed: 2800
    density: 1850
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.32
    specific_heat_capacity: 1793
    perfusion: 20
    absorption_coeff: 3.78 # PRESTUS v05 default (Pinton et al., 2012: 2.7 + 0.2 x 5.4 shear)