simulation:
  medium: phantom

# Heat deposition from the absorption coefficient [dB/(cm MHz^y)], y = alpha_power.
# BabelBrain specifies absorption as a fraction of attenuation; absorption_coeff below is
# that fraction x the BabelBrain alpha_coeff (fraction kept in the comment for reference).
thermal:
  absorption_model: coefficient

grid:
  resolution_mm: 0.5
  default_dims: [140, 240]
  pml_size: 40
  axisymmetric: 1
  use_kWaveArray: 1

medium_properties:
  water:
    sound_speed: 1482
    density: 994
    alpha_coeff: 0.0022
    alpha_power: 2
    thermal_conductivity: 0.60
    specific_heat_capacity: 4178
    absorption_coeff: 0.0022 # = water alpha_coeff (fraction 1)
  brain:
    sound_speed: 1562
    density: 1041
    alpha_coeff: 0.48
    alpha_power: 1
    thermal_conductivity: 0.51
    specific_heat_capacity: 3630
    perfusion: 559
    absorption_coeff: 0.408 # = BabelBrain absorption fraction 0.85 x alpha_coeff 0.48
  skull:
    sound_speed: 2800
    density: 1850
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.315
    specific_heat_capacity: 1793
    perfusion: 20
    absorption_coeff: 2.1679 # = BabelBrain absorption fraction 0.163 x alpha_coeff 13.3