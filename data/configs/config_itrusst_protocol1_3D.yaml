simulation:
  medium: phantom

# model only water, brain, and skull layers
layers:
  water: [0, 3, 6, 9, 10]
  brain: [1, 2]
  skull: [4, 7, 8]

transducer:
  type: annular
  freq_hz: 500000.0
  trans_pos: [70, 70, 2]      # 35mm lateral center (x,y); 1mm offset from active domain edge (z)
  focus_pos: [70, 70, 130]    # same lateral; 64mm focal distance: 2 + 128 voxels (0.5mm resolution)
  focal_distance_ep: 55.42562584220407
  focal_distance_bowl: 64.0
  focal_distance_offset: 8.57437415779593
  annular: {elem_n: 1.0, elem_id_mm: 0.0, elem_od_mm: 64.0, elem_amp: 69572.0, elem_phase_deg: 295.78271951909704,
    curv_radius_mm: 64.0, dist_geom_ep_mm: 55.42562584220407, depth_mm: 1.0, elem_phase_rad: 5.162382326111142}

modules:
  run_source_setup: 1
  run_acoustic_sims: 1
  run_heating_sims: 1
  run_posthoc_water_sims: 0

grid:
  resolution_mm: 0.5    # [mm]
  default_dims: [140, 140, 240] # active domain: 70mm x 70mm lateral, 120mm axial (PML added externally)
  pml_size: 40          # 20mm PML at 0.5mm/voxel = 40 grid points
  axisymmetric: 0
  use_kWaveArray: 1

placement:
  localite:
    enabled: 0

medium_properties:
  water:
    sound_speed: 1482
    density: 994
    alpha_coeff: 0.0022
    alpha_power: 2
    thermal_conductivity: 0.60
    specific_heat_capacity: 4178
  brain:
    sound_speed: 1546
    density: 1045
    alpha_coeff: 0.42
    alpha_power: 1
    thermal_conductivity: 0.51
    specific_heat_capacity: 3630
  skull:
    sound_speed: 2800
    density: 1850
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.32
    specific_heat_capacity: 1313
  skull_trabecular: # trabecular bone
    sound_speed: 2200 # [m/s]
    density: 1178 # [kg/m^3]
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.31 # [W/m/°C]
    specific_heat_capacity: 2274 # [J/kg/°C]
    perfusion: 30
    absorption_fraction: 0.58
  skull_cortical: # cortical bone
    sound_speed: 2850 # [m/s]
    density: 1908 # [kg/m^3]
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.32 # [W/m/°C]
    specific_heat_capacity: 1313 # [J/kg/°C]
    perfusion: 10
    absorption_fraction: 0.58

timing:
  # (model multiple PTR each containing a single PT)
  pd: 0.02              # Pulse Duration (PD) [seconds]
  pri: 0.2              # Pulse Repetition Interval (PRI) [seconds]
  ptd: 0.2              # Pulse Train Duration (PTD) [seconds]
  pt_timestep: 0.02     # Modeling time steps inside a PT [seconds]
  ptri: 0.2             # Pulse Train Repetition Interval (PTRI) [seconds]
  ptrd: 80              # Pulse Train Repetition Duration (PTRD) [seconds]
  post_ptri_dur: 80     # Cooloff Duration following the PTRI [seconds]
  post_pt_timestep: 1   # Modeling time steps following PT & PTRI [seconds]
  equal_step_duration: 0

thermal:
  cem43_iso: 1
  temp_0:
    water: 37
    skull: 37
    brain: 37
    skin: 37
    skull_trabecular: 37
    skull_cortical: 37
  sensor_xy_halfsize: 120
  record_t_at_every_step: 0
