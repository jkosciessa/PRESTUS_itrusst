simulation:
  medium: phantom

# Heat deposition from the absorption coefficient [dB/(cm MHz^y)], y = alpha_power.
# kPlan specifies absorption as a fraction of attenuation; absorption_coeff below is
# that fraction x the kPlan alpha_coeff (fraction kept in the comment for reference).
thermal:
  absorption_model: coefficient

grid:
  resolution_mm: 0.5
  default_dims: [140, 240]
  pml_size: 40
  axisymmetric: 1
  use_kWaveArray: 1

medium_properties:
  water:
    sound_speed: 1482
    density: 994
    alpha_coeff: 0.0022
    alpha_power: 2
    thermal_conductivity: 0.60
    specific_heat_capacity: 4178
    absorption_coeff: 0.0022 # = water alpha_coeff (fraction 1)
  brain:
    sound_speed: 1550
    density: 1045
    alpha_coeff: 0.52
    alpha_power: 1
    thermal_conductivity: 0.51
    specific_heat_capacity: 3600
    perfusion: 0
    absorption_coeff: 0.52 # = kPlan absorption fraction 1.0 x alpha_coeff 0.52
  skull:
    sound_speed: 2627 # kPlan bone: 1.33 x density + 166.7 at the thermal-simulation density 1850 (k-Plan docs, simulation pipeline); was 2800 until 2026-10-29
    density: 1850 # kPlan: mapped from HU for acoustics; 1850 for thermal simulations
    alpha_coeff: 13.3
    alpha_power: 1
    thermal_conductivity: 0.32
    specific_heat_capacity: 1300
    perfusion: 0
    absorption_coeff: 13.3 # = kPlan absorption fraction 1.0 x alpha_coeff 13.3